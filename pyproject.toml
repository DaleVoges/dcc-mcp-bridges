[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuke-mcp-bridge"
dynamic = ["version"]
description = "MCP server that lets Claude control Foundry Nuke (Python and TCL) through a bridge running inside Nuke."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<3"]
keywords = ["nuke", "foundry", "compositing", "mcp", "model-context-protocol", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/DaleVoges/nuke-mcp-bridge"
Issues = "https://github.com/DaleVoges/nuke-mcp-bridge/issues"

[project.scripts]
nuke-mcp-bridge = "nuke_mcp_bridge.server:main"

[tool.hatch.version]
path = "src/nuke_mcp_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nuke_mcp_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]
