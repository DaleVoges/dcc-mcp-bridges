[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "houdini-mcp-bridge"
dynamic = ["version"]
description = "MCP server that lets Claude control SideFX Houdini (hou Python and HScript) through a bridge running inside Houdini."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<3"]
keywords = ["houdini", "sidefx", "mcp", "model-context-protocol", "claude", "hou"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.urls]
Homepage = "https://github.com/DaleVoges/houdini-mcp-bridge"
Issues = "https://github.com/DaleVoges/houdini-mcp-bridge/issues"

[project.scripts]
houdini-mcp-bridge = "houdini_mcp_bridge.server:main"

[tool.hatch.version]
path = "src/houdini_mcp_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/houdini_mcp_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "pyproject.toml"]
